services:
  meridian:
    build: .
    image: meridian-crm:latest
    container_name: meridian
    restart: unless-stopped
    # Loopback-only by default: the app is a single-machine deployment. Put a TLS
    # reverse proxy (Caddy/nginx) on the same host in front of 127.0.0.1:4000.
    # To expose the container on another interface, change this to "4000:4000"
    # only when a host firewall restricts that port to the proxy.
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      # Required. Generate with: openssl rand -base64 48
      # Weak or placeholder secrets are rejected when NODE_ENV=production.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value generated with openssl rand -base64 48}
      # Browser origins allowed to call the API with cookies. Set to your public origin in production.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      DATABASE_URL: file:/data/meridian.db
      SERVE_WEB: "1"
      # Compose is plain HTTP on loopback, so the refresh cookie must not be Secure here.
      # Set to 1 when TLS terminates in front of the container.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Disabled by default. Only set to 127.0.0.1 or the reverse proxy's CIDR;
      # never enable it when the API is directly reachable.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - meridian_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  meridian_data:
